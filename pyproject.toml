[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openimis-be-claim"
dynamic = ["version"]
description = "The openIMIS Backend Claim reference module."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Xavier Gillmann", email = "xgillmann@bluesquarehub.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=4.2,<5",
    "django-db-signals>=0.1.1,<1",
    "djangorestframework>=3.14,<4",
    "openimis-be-core",
    "openimis-be-claim_batch",
    "openimis-be-insuree",
    "openimis-be-location",
    "openimis-be-medical",
    "openimis-be-policy",
    "openimis-be-product",
    "openimis-be-report",
]

[project.urls]
Homepage = "https://openimis.org/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["claim*"]

[tool.setuptools.package-data]
"claim.reports.templates" = ["*.json"]

[tool.setuptools.data-files]
"locale/en/LC_MESSAGES" = ["locale/en/LC_MESSAGES/django.po"]

# SonarCloud SCA: uv.lock pins PyPI deps; openimis-be-* siblings resolve via assembly at runtime.
[tool.sonar]
sources = "claim"
exclusions = "**/migrations/**,**/static/**,**/media/**,**/tests/**"

# WO-007: Forge CI type-check gate. Baseline mode until WO-031 tightens rules.
[tool.mypy]
python_version = "3.11"
files = ["claim"]
exclude = ["claim/migrations/", "claim/tests/"]
ignore_missing_imports = true
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = false
warn_unused_ignores = true
follow_imports = "silent"
disable_error_code = ["var-annotated", "attr-defined", "name-defined", "arg-type"]
