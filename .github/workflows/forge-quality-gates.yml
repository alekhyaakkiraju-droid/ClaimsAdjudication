# WO-007: Forge-aligned quality and security gates for this module repo.
# Runs on PRs and protected branches without requiring the full openimis-be_py assembly.

name: Forge Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'feature/**'
      - 'wo/**'
  workflow_dispatch:

concurrency:
  group: forge-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: python -m pip install flake8
      - name: Flake8 (blocking)
        run: |
          python -m flake8 claim --config=.flake8 --ignore W503,E501 --count --statistics

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install mypy and stubs
        run: |
          python -m pip install mypy django-stubs djangorestframework-stubs types-requests
      - name: Mypy (blocking)
        run: bash scripts/run-forge-mypy-gate.sh

  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit uv
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt
          python -m pip_audit -r /tmp/requirements-audit.txt --desc on

  sast:
    name: Code scan (bandit, high severity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bandit SAST
        run: |
          python -m pip install bandit
          bandit -r claim -lll -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gates-passed:
    name: All Forge gates passed
    runs-on: ubuntu-24.04
    needs: [build, lint, typecheck, dependency-scan, sast, secret-scan]
    if: always()
    steps:
      - name: Require all upstream jobs
        if: >-
          needs.build.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.dependency-scan.result != 'success' ||
          needs.sast.result != 'success' ||
          needs.secret-scan.result != 'success'
        run: |
          echo "Gate results: build=${{ needs.build.result }} lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} dependency-scan=${{ needs.dependency-scan.result }} sast=${{ needs.sast.result }} secret-scan=${{ needs.secret-scan.result }}"
          exit 1
      - name: All gates passed
        if: >-
          needs.build.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.typecheck.result == 'success' &&
          needs.dependency-scan.result == 'success' &&
          needs.sast.result == 'success' &&
          needs.secret-scan.result == 'success'
        run: echo "All Forge quality gates passed."
