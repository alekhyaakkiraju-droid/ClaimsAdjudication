# Opsera hybrid CI — triggered by Opsera Job Engine
# Use case PY-01: Python module build, lint, security gates
# Docs: docs/opsera/blueprints/py-01-module-ci.md

name: Opsera Hybrid Python CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment label (dev, staging, prod)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      run_extended_tests:
        description: Run assembly integration tests (requires OPENIMIS_MANAGE_PY secret)
        required: false
        default: false
        type: boolean

concurrency:
  group: opsera-ci-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  opsera-ci:
    name: Opsera CI (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    env:
      OPSERA_ENV: ${{ inputs.environment }}

    steps:
      - name: Pipeline context
        run: |
          echo "Opsera environment: ${{ inputs.environment }}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Ref: ${GITHUB_REF}"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Lint (flake8)
        run: |
          pip install flake8
          python -m flake8 claim --config=.flake8 --ignore W503,E501 --count

      - name: Type check (mypy)
        run: |
          pip install mypy django-stubs djangorestframework-stubs types-requests
          bash scripts/run-forge-mypy-gate.sh

      - name: SAST (Bandit)
        run: |
          pip install bandit
          bandit -r claim -lll -q

      - name: Dependency scan (pip-audit)
        run: |
          pip install pip-audit
          python - <<'PY' > /tmp/requirements-audit.txt
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          for dep in data["project"]["dependencies"]:
              if not dep.startswith("openimis-be"):
                  print(dep)
          PY
          python -m pip_audit -r /tmp/requirements-audit.txt --desc on

      - name: Sibling compatibility
        run: chmod +x scripts/verify-sibling-compatibility.sh && ./scripts/verify-sibling-compatibility.sh

      - name: Extended assembly tests (optional)
        if: inputs.run_extended_tests == true
        env:
          OPENIMIS_MANAGE_PY: ${{ secrets.OPENIMIS_MANAGE_PY }}
        run: |
          if [ -z "${OPENIMIS_MANAGE_PY}" ]; then
            echo "OPENIMIS_MANAGE_PY secret not configured — skipping extended tests"
            exit 1
          fi
          pip install -e .
          "${OPENIMIS_MANAGE_PY}" test claim --verbosity=1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ inputs.environment }}-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Opsera summary
        run: |
          echo "## Opsera PY-01 CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ inputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: dist-${{ inputs.environment }}-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next Opsera steps: Checkmarx → qTest → approval" >> "$GITHUB_STEP_SUMMARY"
